<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#2c2923" />
    <meta name="description" content="Marie’s Guesthouse — warm, easy stays in Katutura, Windhoek." />
    <title>Marie’s Guesthouse · Katutura, Windhoek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <form name="booking-enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking-enquiry" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="guests"><option>1 guest</option></select>
      <input type="date" name="arrival" />
      <input type="date" name="departure" />
      <select name="room"><option>Any available room</option></select>
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
